[project]
name = "comfyui-vfx-naming"
description = "Build VFX-compliant filename prefixes for Save Image and video saver nodes. The naming convention - tokens, validation, folder depth and the node's own fields - is JSON configuration."
version = "3.0.0"
license = { text = "MIT" }
requires-python = ">=3.9"
# Needs the V3 node API with nested DynamicCombo expansion.
requires-comfyui = ">=0.8.0"

[project.urls]
Repository = "https://github.com/vctrprzvfx/ComfyUI-VFX-Naming"

[tool.comfy]
PublisherId = ""
DisplayName = "VFX Naming Convention"
Icon = ""
